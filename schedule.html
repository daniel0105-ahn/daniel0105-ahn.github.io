<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방학 네온 시간표</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#24232a;font-family:"Malgun Gothic",system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}h1{margin:0;font-size:28px;font-weight:500;text-shadow:0 0 5px #fff,0 0 10px #c13cff,0 0 22px #c13cff}.sub,p{color:#6b6670;margin:6px 0}.btn{cursor:pointer;border:1px solid #c13cff;border-radius:999px;background:#fff;color:#9322c8;font:inherit;padding:10px 17px;box-shadow:0 0 7px #e3a9ff,inset 0 0 5px #f4d8ff}.primary{background:#aa28df;color:#fff;box-shadow:0 0 10px #c651f1,0 0 20px #e3a9ff}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.name{text-align:center;color:#008da6;font-weight:700;text-shadow:0 0 7px #67ddea;margin-bottom:8px}.timeline{height:370px;border:1px solid #d9d4df;border-radius:13px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 12px #eee6f2}.slot{min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:5px;border-bottom:1px solid #fff;font-size:14px;font-weight:600}.slot small{font-weight:400;margin-top:3px}.read{background:#f3e4ff;color:#76159e;box-shadow:inset 0 0 14px #dc92ff}.home{background:#e0f9fb;color:#007e92;box-shadow:inset 0 0 13px #72deea}.rest{background:#fff4c9;color:#8a6700;box-shadow:inset 0 0 12px #ffe273}.legend{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:16px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.editor{margin-top:22px;border:1px solid #ded5e5;border-radius:13px;padding:18px;box-shadow:0 0 14px #f1e8f5}.editor[hidden]{display:none}.editgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:14px 0}label{display:block;font-size:13px;color:#5b5661;margin-top:8px}input{width:100%;padding:7px;margin-top:4px;border:1px solid #cfc5d5;border-radius:7px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){main{padding:22px 14px}.grid,.editgrid{grid-template-columns:repeat(2,1fr)}.grid>article:last-child{grid-column:1/-1}.timeline{height:270px}}
</style></head><body><main>
<div class="top"><div><h1>✦ 방학 네온 시간표</h1><p>월–금 · 오전 10:00 — 오후 3:00</p></div><button class="btn" id="edit">수정하기</button></div>
<section class="grid" id="schedule"></section><div class="legend"><span><i class="dot" style="background:#c13cff"></i>독서</span><span><i class="dot" style="background:#00afc6"></i>숙제</span><span><i class="dot" style="background:#e3b900"></i>휴식</span></div>
<section class="editor" id="editor" hidden><strong>하루별 시간 조정</strong><p>독서는 60분 이상, 휴식은 60분 이하입니다. 남은 시간은 숙제로 채워져요.</p><div class="editgrid" id="inputs"></div><div class="actions"><button class="btn primary" id="save">저장하기</button><button class="btn" id="shuffle">임의로 다시 배치</button><button class="btn" id="close">닫기</button></div></section>
</main><script>
const days=['월','화','수','목','금'];let data=[{r:120,b:30},{r:60,b:45},{r:90,b:35},{r:90,b:40},{r:120,b:60}],types=[0,1,2,1,0];
const t=n=>String(10+Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function blocks(p,v){let h=300-p.r-p.b,a=v==0?Math.round(p.r*.55):v==1?p.r:Math.round(p.r*.42),c=p.r-a,x=Math.round(h*(v==2?.55:.45));return v==0?[['read','독서',a],['home','숙제',h],['rest','휴식',p.b],['read','독서',c]]:v==1?[['home','숙제',x],['read','독서',a],['rest','휴식',p.b],['home','숙제',h-x]]:[['read','독서',a],['home','숙제',x],['rest','휴식',p.b],['home','숙제',h-x],['read','독서',c]]}
function draw(){schedule.innerHTML=days.map((d,i)=>{let n=0;return `<article><div class="name">${d}요일</div><div class="timeline">${blocks(data[i],types[i]).filter(x=>x[2]).map(x=>{let s=n;n+=x[2];return `<div class="slot ${x[0]}" style="flex:${x[2]}">${x[1]}<small>${t(s)}–${t(n)}</small></div>`}).join('')}</div></article>`}).join('')}
function fields(){inputs.innerHTML=days.map((d,i)=>`<div><b>${d}요일</b><label>독서 (분)<input type="number" min="60" max="240" data-i="${i}" data-k="r" value="${data[i].r}"></label><label>휴식 (분)<input type="number" min="0" max="60" data-i="${i}" data-k="b" value="${data[i].b}"></label></div>`).join('')}
edit.onclick=()=>{fields();editor.hidden=false};close.onclick=()=>editor.hidden=true;shuffle.onclick=()=>{types=types.map(x=>(x+1)%3);draw()};save.onclick=()=>{let next=data.map(x=>({...x}));inputs.querySelectorAll('input').forEach(e=>next[e.dataset.i][e.dataset.k]=+e.value);if(next.some(x=>x.r<60||x.r>240||x.b<0||x.b>60||x.r+x.b>300))return alert('독서는 60~240분, 휴식은 0~60분으로 설정해 주세요.');data=next;draw();editor.hidden=true};draw();
</script></body></html>
