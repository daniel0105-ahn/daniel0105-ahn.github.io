<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CODE · 중2 수학 심화 퀴즈</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#182133;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}.wrap{width:min(760px,calc(100% - 30px));margin:26px auto 40px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:2px solid #ff32b6;padding:0 0 15px;box-shadow:0 5px 14px -13px #e4008d}h1{font-size:1.5rem;margin:0;font-weight:600;letter-spacing:.02em;text-shadow:0 0 3px #00d9ff,0 0 9px #00d9ff}.count{color:#b90075;font-weight:700}.sub{color:#5d6879;line-height:1.6}.progress{height:9px;background:#edf1f6;border-radius:99px;margin:18px 0}.progress>i{display:block;height:100%;background:#00cce8;box-shadow:0 0 9px #00cce8;border-radius:99px;transition:width .25s}.question{font-weight:600;font-size:1.18rem;line-height:1.8;min-height:102px;padding:10px 1px}.answerline{display:flex;gap:9px;flex-wrap:wrap}.answer{flex:1 1 260px;font:inherit;border:1.5px solid #cad4e1;border-radius:9px;background:#fff;color:#182133;padding:13px 14px;outline:none}.answer:focus{border-color:#00cce8;box-shadow:0 0 10px #8defff}.check{font:inherit;border:1.5px solid #182133;border-radius:9px;background:#182133;color:#fff;padding:13px 18px;cursor:pointer;font-weight:700}.check:hover{box-shadow:0 0 12px #00cce8}.feedback{margin:17px 0;padding:13px;border-left:4px solid #00cce8;background:#f5fcff;min-height:57px;line-height:1.6}.feedback.bad{border-color:#ff247a;background:#fff5f9}.feedback.good{border-color:#00b88c;background:#f2fff9}.action{display:none;width:100%;text-align:center;font:inherit;border:1.5px solid #182133;border-radius:9px;background:#182133;color:#fff;padding:13px 14px;cursor:pointer;font-weight:700}.action:hover{box-shadow:0 0 12px #00cce8}.result{text-align:center;padding:28px 5px;font-size:1.22rem;line-height:1.8}.result strong{color:#b90075;text-shadow:0 0 5px #ff7dc9}.small{font-size:.92rem;color:#5d6879}@media(max-width:430px){.wrap{width:min(100% - 22px,760px);margin-top:17px}.question{font-size:1.08rem}}
</style></head><body><div class="wrap"><div class="top"><h1>NEON MATH · 중2 1학기 심화</h1><div class="count" id="count"></div></div><p class="sub">새로고침하거나 다시 시작할 때마다 다른 50문제가 만들어집니다.</p><div class="progress"><i id="bar"></i></div><main id="app"></main></div>
<script>
(()=>{const $=s=>document.querySelector(s),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,sgn=n=>n<0?`−${-n}`:`${n}`,fmt=n=>n<0?`(${sgn(n)})`:n,unique=a=>[...new Set(a.map(String))].map(Number),opts=(ans,steps=[1,-1,2,-2,3])=>{let a=[ans];for(const step of steps){if(a.length===5)break;let v=ans+step;if(!a.includes(v))a.push(v)}while(a.length<5){let v=ans+rnd(-9,9);if(!a.includes(v))a.push(v)}return a.sort(()=>Math.random()-.5)};
function equation(){let x=rnd(-8,12),a=rnd(3,7),d=rnd(1,a-2),b=rnd(-6,6),e=rnd(-5,5),c=rnd(-9,9),f=a*(x+b)-c-d*(x-e);return {q:`${a}(x${b>=0?'+':''}${b}) ${c>=0?'−':'+'} ${Math.abs(c)} = ${d}(x${e>=0?'+':''}${e}) ${f>=0?'+':''}${f} 의 해 x는?`,a:x,e:`양변을 전개한 뒤 x항을 한쪽에 모으면 x=${x}입니다.`}}
function fractionEq(){let x=rnd(3,14),p=rnd(2,5),r=rnd(2,5);while(r===p)r=rnd(2,5);let q=rnd(-4,5),t=x/p+q-x/r; if(!Number.isInteger(x/p)||!Number.isInteger(x/r))return fractionEq();return {q:`x/${p} ${q>=0?'+':''}${q} = x/${r} ${t>=0?'+':''}${t} 의 해 x는?`,a:x,e:`양변에 ${p*r}을 곱해 분모를 없앤 뒤 x를 정리하면 x=${x}입니다.`}}
function inequality(){let x=rnd(-7,7),a=-rnd(2,5),b=rnd(-8,8),v=a*x+b;return {q:`${a}x ${b>=0?'+':''}${b} ≥ ${v} 를 만족하는 x의 범위는?`,a:x,custom:[`x≤${x}`,`x≥${x}`,`x<${x}`,`x>${x}`,`x=${x}`],correct:0,e:`${a}x≥${v-b}에서 음수 ${a}로 나누므로 부등호 방향이 바뀝니다. 경계값은 x=${x}이므로 x≤${x}입니다.`}}
function consecutive(){let m=rnd(8,35),gap=rnd(2,4),sum=3*m;return {q:`세 정수 x−${gap}, x, x+${gap}의 합이 ${sum}일 때, 가장 큰 수는?`,a:m+gap,e:`세 수의 합은 3x이므로 x=${m}. 가장 큰 수는 ${m}+${gap}=${m+gap}입니다.`}}
function ratio(){let u=rnd(3,8),v=rnd(4,9),k=rnd(5,12);return {q:`두 수의 비가 ${u}:${v}이고 두 수의 차가 ${Math.abs(v-u)*k}일 때, 큰 수는?`,a:Math.max(u,v)*k,e:`비의 차 ${Math.abs(v-u)}칸이 ${Math.abs(v-u)*k}이므로 한 칸은 ${k}. 큰 수는 ${Math.max(u,v)}×${k}=${Math.max(u,v)*k}입니다.`}}
function triangle(){let b=rnd(32,68),c=rnd(28,70);while(b+c>=170||Math.abs(b-c)<5)c=rnd(28,70);let a=180-b-c;return {q:`△ABC에서 ∠B=${b}°, ∠C=${c}°이다. ∠A의 외각의 크기는?`,a:b+c,e:`외각은 이웃하지 않은 두 내각의 합입니다. 따라서 ${b}°+${c}°=${b+c}°입니다.`}}
function polygon(){let n=rnd(6,12),ans=(n-2)*180;return {q:`한 꼭짓점에서 그을 수 있는 대각선이 ${n-3}개인 다각형의 내각의 합은?`,a:ans,e:`변의 수 n은 ${n-3}+3=${n}. 내각의 합은 (n−2)×180°=${ans}°입니다.`}}
function isosceles(){let top=rnd(28,82);if(top%2)top++;let base=(180-top)/2;return {q:`AB=AC인 이등변삼각형 ABC에서 꼭지각 ∠A=${top}°일 때, 밑각 하나의 크기는?`,a:base,e:`두 밑각의 합은 180°−${top}°=${180-top}°이고 서로 같으므로 ${base}°입니다.`}}
function prop(){let a=rnd(2,7),b=rnd(3,9),k=rnd(3,10);return {q:`(x+${a}):${b*k} = ${a}:${b} 일 때 x의 값은?`,a:a*k-a,e:`(x+${a})/${b*k}=${a}/${b}이므로 x+${a}=${a*k}. 따라서 x=${a*k-a}입니다.`}}
function direct(){let k=rnd(-6,6);if(k===0)return direct();let x=rnd(-7,8);if(x===0)return direct();let y=k*x;return {q:`y가 x에 정비례하고 x=${x}일 때 y=${y}이다. x=${x+3}일 때 y는?`,a:k*(x+3),e:`정비례식은 y=ax이며 a=${y}/${x}=${k}. 따라서 y=${k}×${x+3}=${k*(x+3)}입니다.`}}
function inverse(){let k=rnd(12,60),x=rnd(2,10);while(k%x!==0)x=rnd(2,10);let y=k/x,twice=x*2;return {q:`y가 x에 반비례하고 x=${x}일 때 y=${y}이다. x가 ${twice}가 될 때 y는?`,a:k/twice,e:`반비례에서는 xy가 일정합니다. xy=${k}이므로 y=${k}/${twice}=${k/twice}입니다.`}}
function line(){let m=rnd(-5,5);if(m===0)return line();let b=rnd(-8,8),x=rnd(-6,7);return {q:`일차함수 y=${m}x ${b>=0?'+':''}${b}에서 x가 ${x}에서 ${x+4}로 변할 때 y의 변화량은?`,a:m*4,e:`y의 변화량은 기울기×x의 변화량입니다. ${m}×4=${m*4}입니다.`}}
function intersect(){let x=rnd(-5,8),m=rnd(-5,5),n=rnd(-5,5);if(m===n||m===0||n===0)return intersect();let b=rnd(-8,8),d=(m-n)*x+b;return {q:`두 직선 y=${m}x ${b>=0?'+':''}${b}, y=${n}x ${d>=0?'+':''}${d}의 교점의 x좌표는?`,a:x,e:`두 식의 y값을 같게 두고 정리하면 x=${x}입니다.`}}
function intercept(){let m=rnd(-6,6);if(!m)return intercept();let x=rnd(-6,6);if(!x)return intercept();let r=-m*x;return {q:`직선 y=${m}x ${r>=0?'+':''}${r}이 x축과 만나는 점의 x좌표는?`,a:x,e:`x축 위에서는 y=0입니다. 0=${m}x ${r>=0?'+':''}${r}에서 x=${x}입니다.`}}
const makers=[equation,fractionEq,inequality,consecutive,ratio,triangle,polygon,isosceles,prop,direct,inverse,line,intersect,intercept];let qs=Array.from({length:50},(_,i)=>{let z=makers[i%makers.length]();z.id=i+1;return z}).sort(()=>Math.random()-.5),i=0,score=0,locked=false;
function normal(v){return String(v).trim().replace(/\s/g,'').replace(/<=/g,'≤').replace(/>=/g,'≥').replace(/-/g,'−')}function shown(v){return String(v)}function render(){let z=qs[i],answer=z.custom?z.custom[z.correct]:z.a;$('#count').textContent=`${i+1} / 50 · 점수 ${score}`;$('#bar').style.width=`${i/50*100}%`;$('#app').innerHTML=`<div class="question">${i+1}. ${z.q}</div><div class="answerline"><input class="answer" id="answer" autocomplete="off" placeholder="답을 입력하세요"><button class="check" id="check">정답 확인</button></div><div class="feedback" id="feedback" aria-live="polite">답을 입력한 뒤 정답 확인을 눌러 보세요.</div><button class="action" id="next">${i===49?'결과 보기':'다음 문제 →'}</button>`;$('#answer').focus();$('#check').onclick=()=>checkAnswer(answer,z);$('#answer').onkeydown=e=>{if(e.key==='Enter')checkAnswer(answer,z)}}
function checkAnswer(answer,z){if(locked)return;let input=$('#answer').value;if(!input.trim()){ $('#feedback').className='feedback bad';$('#feedback').textContent='답을 입력해 주세요.';return}locked=true;let f=$('#feedback'),right=normal(input)===normal(answer);$('#answer').disabled=true;$('#check').disabled=true;if(right){score++;f.className='feedback good';f.textContent='정답입니다! '+z.e}else{f.className='feedback bad';f.textContent=`오답입니다. 정답은 ${shown(answer)}입니다. ${z.e}`}$('#count').textContent=`${i+1} / 50 · 점수 ${score}`;$('#next').style.display='block';$('#next').onclick=()=>{if(i<49){i++;locked=false;render()}else finish()}}
function finish(){$('#bar').style.width='100%';$('#app').innerHTML=`<div class="result">완료!<br><strong>${score} / 50점</strong><br><span class="small">다시 시작하면 수치와 문제 순서가 새로 만들어집니다.</span></div><button class="action" id="restart" style="display:block">새 문제로 다시 시작</button>`;$('#restart').onclick=()=>location.reload()}render();})();
</script></body></html>
